[project]
name = "moldr"
version = "0.1.0"
description = "Project Environment Scaffolder"
readme = "README.md"
authors = [
    { name = "spectropaws", email = "spectropaws777@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
moldr = "moldr:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
